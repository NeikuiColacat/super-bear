[project]
name = "super-bear"
version = "0.1.0"
description = "Attention-budgeted event intelligence prototypes for Nasdaq-100 investors."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
