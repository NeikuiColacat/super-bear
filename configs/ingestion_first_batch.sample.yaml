version: 1
source_registry_path: configs/sources.yaml
raw_dir: data/raw
normalized_dir: data/normalized
runs_dir: data/runs
default_limit: 2
enabled_source_ids:
  - company_ir
  - yfinance
  - tavily
  - brave_search
  - stock_sentiment
skip_unimplemented_adapters: false
write_chunks: false
write_candidates: false
write_ledger: false
write_events: false
write_event_cards: false
write_brief: false
source_options:
  company_ir:
    catalog_path: configs/company_ir_sources.yaml
    continue_on_feed_error: true
  yfinance:
    tickers:
      - AAPL
    period: 5d
    interval: 1d
    currency: USD
  tavily:
    queries:
      - '"AAPL" earnings release site:apple.com/newsroom'
    max_results: 5
    search_depth: basic
    include_raw_content: false
  brave_search:
    queries:
      - '"AAPL" earnings release investor relations'
    count: 5
    freshness: pw
  stock_sentiment:
    tickers:
      - AAPL
    sources:
      - reddit
    lookback: 24h
